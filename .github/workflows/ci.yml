name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # Every uv command below uses the interpreter of this matrix job. Without it, `uv run`
      # takes the version in .python-version and rebuilds the environment on that one.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-extras
      # The later steps use the environment installed above as it is (--no-sync): when a
      # plain `uv run` rebuilds the environment, it does so without the extras. This step
      # fails if the environment is not the matrix interpreter with every extra.
      - name: Check the environment
        run: >-
          uv run --no-sync python -c
          "import sys, modal, openai, fastapi, uvicorn, markdown_it, google.genai;
          assert '%d.%d' % sys.version_info[:2] == '${{ matrix.python-version }}', sys.version"
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      # The tests that compile real documents (the end-to-end run of the whole pipeline is
      # one of them) are skipped without TeX Live, so CI would pass without exercising it.
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-science \
            texlive-bibtex-extra texlive-publishers texlive-plain-generic lmodern cm-super
      # Tests are offline. With this variable set, a missing TeX install fails the run
      # instead of skipping those tests.
      - name: Test
        env:
          PAPER_ORCHESTRA_REQUIRE_TEX: "1"
        run: uv run --no-sync pytest

  # The web app in a real browser. The matrix above skips this test (no browser there);
  # here a skip is a failure, so that the app is never merged unlooked at.
  browser:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    defaults:
      run:
        # Named explicitly so that the steps run with pipefail: a failing test must fail
        # its step although its output goes through tee.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: uv sync --extra ui
      # The tests give every process a home directory of its own, so the browser is kept
      # where a variable says and not under ~/.cache, where the test would not find it.
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" playwright@1.63.0
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright-browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/playwright/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser test, light theme
        run: |
          uv run --no-sync pytest tests/test_web_e2e.py -rs | tee light.txt
          ! grep -q skipped light.txt
      - name: Browser test, dark theme
        env:
          PAPER_ORCHESTRA_E2E_SCHEME: dark
        run: |
          uv run --no-sync pytest tests/test_web_e2e.py -rs | tee dark.txt
          ! grep -q skipped dark.txt
